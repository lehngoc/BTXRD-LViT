experiment:
  name: loss_ablation_screening_focal_bce_dice_07
  loss_id: focal_bce_dice_07
  stage: screening

data: {root_dir: ., tumor_only: false, train_csv: data/exports/btxrd_preprocessed/train.csv, val_csv: data/exports/btxrd_preprocessed/val.csv, test_csv: data/exports/btxrd_preprocessed/test.csv}
model: {name: unet, in_channels: 3, out_channels: 1, base_channels: 64}
training:
  seed: 42
  device: auto
  image_size: 224
  image_mean: [0.0, 0.0, 0.0]
  image_std: [1.0, 1.0, 1.0]
  batch_size: 4
  accumulation_steps: 2
  num_workers: 0
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.0
  optimizer: adam
  loss_type: focal_bce_dice
  focal_weight: 0.7
  dice_weight: 0.3
  gamma: 2.0
  alpha_positive: 0.25
  early_stopping_patience: 0
  output_dir: experiments/loss_ablation/screening/focal_bce_dice_07/seed42
  augmentation: {enabled: true, type: legacy_lvit}
  scheduler: {name: cosine_warm_restarts, t_0: 10, t_mult: 1, eta_min: 0.0001}
metrics:
  threshold: 0.5
  threshold_sweep: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  min_fp_area_ratio: 0.0001
  selection: {enabled: true, dice_tolerance: 0.05}
