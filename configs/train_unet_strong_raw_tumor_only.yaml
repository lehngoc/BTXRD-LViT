experiment:
  name: E0s_unet_strong_raw_224_tumor_only

data:
  root_dir: .
  tumor_only: true
  train_csv: data/exports/btxrd_raw_seed42/train.csv
  val_csv: data/exports/btxrd_raw_seed42/val.csv
  test_csv: data/exports/btxrd_raw_seed42/test.csv

model:
  name: unet
  in_channels: 3
  out_channels: 1
  base_channels: 64

training:
  seed: 42
  device: auto
  image_size: 224
  image_mean: [0.0, 0.0, 0.0]
  image_std: [1.0, 1.0, 1.0]
  batch_size: 4
  accumulation_steps: 2
  num_workers: 0
  epochs: 200
  learning_rate: 0.0003
  weight_decay: 0.0
  optimizer: adam
  loss_type: legacy_weighted_dice_bce
  bce_weight: 0.5
  dice_weight: 0.5
  foreground_weight: 0.3
  background_weight: 0.7
  early_stopping_patience: 100
  label_fraction: 1.0
  text_column: text_lvit_prompt
  output_dir: experiments/E0s_unet_strong_raw_224_tumor_only
  augmentation:
    enabled: true
    type: legacy_lvit
  scheduler:
    name: cosine_warm_restarts
    t_0: 10
    t_mult: 1
    eta_min: 0.0001

metrics:
  threshold: 0.5
  min_fp_area_ratio: 0.001
